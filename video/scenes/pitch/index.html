<script>
'use strict';
const S = AT.scene({ duration: 81.7, progress: false, seed: 23 });
const { el, style, show, progress, ease, lerp, spring } = AT;
const W = 1920;
const node = (html, cls, parent, pos) => { const e = el('div', cls, parent, html); AT.place(e, pos || {}); return e; };
const anim = (e, o) => { S.every(t => show(e, t, o)); return e; };
const center = h => { h.el.style.width = W + 'px'; h.el.style.left = '0px'; h.el.style.textAlign = 'center'; for (const ln of h.el.querySelectorAll('.line')) ln.style.margin = '0 auto'; return h; };
// a gradient ring that is on over [a, b]
const ringOn = (ring, a, b) => S.every(t => { ring.style.opacity = (ease.easeOutCubic(progress(t, a, a + 0.3)) * (1 - ease.easeInCubic(progress(t, b, b + 0.3)))).toFixed(3); });
// Shots are AT.Group: each dissolves under the next one as the next becomes readable (no empty
// frame), the last one holds. EDL cut points sit where only one shot is on screen: 63.7 and 64.7.
// Section times follow the narration: each caption is a spoken line (video/vo/narration.py).

/* ================================================================== 06 WHY NOW (0 - 20.6)
   Frame 0 is already composed (it follows the hero's how-it-works on a crossfade). Three cards,
   no camera moves: the card being read gets a gradient ring, the others step back. */
const gNow = AT.Group({ name: 'now', t0: 0, t1: 20.6, enter: 'none', drift: 0.012 }).e;
AT.SectionLabel({ parent: gNow, num: '06', text: 'WHY NOW', at: -1, x: 128, y: 120 });
const nowHead = AT.Headline({ parent: gNow, lines: ['The rails just landed.'], at: -1, x: 122, y: 166, size: 72 });
const CARDS = [
  { id: 'KB-SOL-03', big: 'Sep 30, 2026', tx: 'PayAI opened x402 batch settlement on Solana in public preview: a mainnet path for sub-cent traffic.', so: 'docs/KNOWLEDGE_BASE.md · solanacompass.com', on: [0.3, 4.9] },
  { id: 'KB-MKT-01', big: 'Waitlist only', tx: 'Cloudflare opened a waitlist for an x402 Monetization Gateway on 2026-07-01, for Cloudflare customers only.', so: 'docs/KNOWLEDGE_BASE.md · explainx.ai', on: [4.9, 9.9] },
  { id: 'KB-PAY-06', big: 'Agent wallets', tx: "Coinbase's own Payments MCP already pays x402 on Solana, so agent wallets exist today.", so: 'docs/KNOWLEDGE_BASE.md · docs.cdp.coinbase.com', on: [9.9, 15.1] },
];
CARDS.forEach((c, i) => {
  const e = node(`<div class="ring"></div><div class="id">${c.id}</div><div class="big">${c.big}</div><div class="tx">${c.tx}</div><div class="so">${c.so}</div>`, 'kcard', gNow, { x: 128 + i * 568, y: 330 });
  S.every(t => show(e, t, { at: 0.05 + i * 0.12, dur: 0.7, y: 28, blur: 8, scale: 0.97 }));
  ringOn(e.querySelector('.ring'), c.on[0], c.on[1]);
  // the other cards step back while one is read; all of them step back for the closing line
  AT.dim(e, CARDS.map((d, j) => (j === i ? null : d.on)).filter(Boolean), { o: 0.5, blur: 0, ramp: 0.3 });
  AT.dim(e, [[15.1, 99]], { o: 0.1, blur: 8, ramp: 0.5 });
  AT.sfx(c.on[0] + 0.05, 'tick', { gain: 0.6 });
});
AT.dim(nowHead.el, [[15.1, 99]], { o: 0.15, blur: 6, ramp: 0.5 });
center(AT.Headline({ parent: gNow, lines: ['The open, self-hosted, non-custodial version', { text: 'was not built. So we built it.', grad: true }], at: 15.35, y: 400, size: 66, stagger: 0.035 }));

/* ================================================================== 07 WHO BUYS (19.8 - 27.2)
   Four seller types as a 2x2 that builds together; the narration picks one: the data API. */
const gWho = AT.Group({ name: 'who', t0: 19.8, t1: 27.2 }).e;
AT.SectionLabel({ parent: gWho, num: '07', text: 'WHO BUYS', at: 19.95, x: 128, y: 120 });
AT.Headline({ parent: gWho, lines: ['Sellers whose product', { text: 'agents already use.', grad: true }], at: 20, x: 122, y: 160, size: 60, stagger: 0.04 });
anim(node('<b>Buyer types, not customers.</b> No customers and no revenue yet.', 'honest', gWho, { x: 128, y: 322 }), { at: 20.7, y: 8, blur: 3 });
const ICON = {
  api: '<path d="M9 7 4 12l5 5M15 7l5 5-5 5"/>',
  doc: '<path d="M7 3h7l4 4v14H7zM14 3v4h4M9.5 12h6M9.5 15.5h6"/>',
  mcp: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
  agency: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
};
const BUYERS = [
  ['api', 'API or data founder', 'A price per call any agent can pay in seconds, no signup, no key issuing'],
  ['doc', 'Publisher or docs site', 'Agents pay to read, people read free, plus a report of unbilled agent traffic'],
  ['mcp', 'MCP server author', 'A price per tool; <code>initialize</code> and <code>tools/list</code> stay free'],
  ['agency', 'Agency', "Agent revenue as a line item on every client site, funds to the client's own address"],
];
const bg = node('', 'bgrid', gWho, { y: 372 });
BUYERS.forEach(([ic, b, w], i) => {
  const r = el('div', 'bcard', bg, `<div class="ring"></div><svg viewBox="0 0 24 24">${ICON[ic]}</svg><div><div class="b">${b}</div><div class="w">${w}</div></div>`);
  S.every(t => show(r, t, { at: 20.35 + i * 0.12, dur: 0.7, y: 26, blur: 8, scale: 0.97 }));
  if (i === 0) ringOn(r.querySelector('.ring'), 24, 99);          // "Say you run a small data API."
  else AT.dim(r, [[24, 99]], { o: 0.35, blur: 2, ramp: 0.4 });
});
AT.sfx(20.35, 'tick', { gain: 0.55 });
AT.sfx(24.05, 'tick', { gain: 0.6 });

/* ================================================================== 07 THE USE CASE (26.3 - 42.1)
   One seller told end to end, as an example (docs/USE_CASES.md case 1, prices from the demo
   config): agents call, the gateway quotes, the agent pays to the seller's own pay_to. Each step
   lands on its spoken line and keeps a ring while it is the one being read. */
const gCase = AT.Group({ name: 'case', t0: 26.3, t1: 43.1 }).e;
AT.SectionLabel({ parent: gCase, num: '07', text: 'ONE USE CASE', at: 26.4, x: 128, y: 120 });
AT.Headline({ parent: gCase, lines: ['Say you run', { text: 'a small data API.', grad: true }], at: 26.4, x: 122, y: 160, size: 60, stagger: 0.04 });
anim(node('<b>One seller, end to end.</b> Prices from the demo config.', 'case-tag', gCase, { x: 128, y: 322 }), { at: 26.7, y: 8, blur: 3 });
const STEPS = [
  { at: 26.6, html: '<b>Agents call your API all day.</b> None of them can sign up for a key.', on: [26.6, 30.6] },
  { at: 30.7, html: '<b>AgentToll answers 402 with a price:</b> <span class="gd">$0.002</span> per call. No account.', on: [30.7, 34.8] },
  { at: 34.9, html: '<b>The agent pays in USDC,</b> straight to your own <code>pay_to</code>. AgentToll holds nothing.', on: [34.9, 38.6] },
];
const sr = node('', 'srows', gCase, { y: 380 });
STEPS.forEach((st, i) => {
  const r = el('div', 'sr', sr, `<div class="ring"></div><span class="n">${i + 1}</span><span class="t">${st.html}</span>`);
  S.every(t => show(r, t, { at: st.at, dur: 0.6, x: -24, y: 0, blur: 6 }));
  ringOn(r.querySelector('.ring'), st.on[0], st.on[1]);
  AT.sfx(st.at + 0.05, i === 1 ? 'coin' : 'tick', { gain: i === 1 ? 0.45 : 0.5 });
});
anim(node('A card can\'t bill <span class="gd">$0.002</span>. <span class="g">x402 can.</span>', 'punch', gCase, { y: 760 }), { at: 38.75, dur: 0.8, y: 18, blur: 8 });
AT.Badge({ text: 'EXAMPLE · not a customer', at: 26.8, out: 41.5, right: 64, y: 96 });

/* ================================================================== 08 BUSINESS MODEL, PLAN (42.2 - 56.1)
   Two tier cards revealed by a left-to-right wipe. */
const gBiz = AT.Group({ name: 'biz', t0: 42.2, t1: 56.1 }).e;
AT.SectionLabel({ parent: gBiz, num: '08', text: 'BUSINESS MODEL', at: 42.35, x: 128, y: 120 });
AT.Headline({ parent: gBiz, lines: ['How we make money:', { text: 'a plan, no revenue yet.', grad: true }], at: 42.4, x: 122, y: 160, size: 60, stagger: 0.04 });
{
  const tiers = node(`<div class="tier"><div class="tg">OPEN-SOURCE CORE</div><div class="hv">Free</div><div class="tx">MIT and non-custodial.<br>No take rate in the gateway.</div></div>
    <div class="tier"><div class="tg">HOSTED EDITION</div><div class="hv g">Flat tier + a fee on settled volume</div><div class="tx">Billed off-chain.<br>pay_to stays the founder's.</div></div>`, 'tiers', gBiz, { y: 380 });
  [...tiers.children].forEach((c, i) => S.every(t => {
    const p = ease.easeInOutCubic(progress(t, 42.9 + i * 0.45, 43.7 + i * 0.45));
    c.style.clipPath = p >= 1 ? 'none' : `inset(-40px ${(100 - p * 100).toFixed(2)}% -40px -40px round 24px)`;
    c.style.opacity = p > 0 ? '1' : '0';
  }));
  AT.dim(tiers.children[1], [[46.3, 48.3]], { o: 0.45, blur: 0, ramp: 0.3 });   // "The core is free." reads the free card first
  AT.sfx(42.9, 'whoosh', { gain: 0.35, pan: -0.3 });
}
AT.Badge({ text: 'PLAN · no revenue yet', at: 42.6, out: 55.5, right: 64, y: 96 });

/* ================================================================== 09 DISTRIBUTION, PLAN (55.3 - 63.8)
   The flow with a packet on the payout leg; no product names the viewer has to look up. */
const gDist = AT.Group({ name: 'dist', t0: 55.3, t1: 64.6, drift: 0.03 }).e;
AT.SectionLabel({ parent: gDist, num: '09', text: 'DISTRIBUTION', at: 55.45, x: 128, y: 120 });
center(AT.Headline({ parent: gDist, lines: ['We already ship landing pages', { text: 'to small businesses.', grad: true }], at: 55.5, y: 176, size: 72, stagger: 0.035 }));
const flow = node(`<div class="fnode"><div class="tg">CLIENT SITE</div><div class="tt">Vercel origin</div></div>
  <div class="farr l"><div class="hd"></div></div>
  <div class="fnode gw"><div class="tg">GATEWAY</div><div class="tt">AgentToll</div></div>
  <div class="farr r"><div class="hd"></div><div class="pk"></div></div>
  <div class="fnode"><div class="tg">PAY_TO</div><div class="tt">client's address</div></div>`, 'flow', gDist, { y: 456 });
{
  const kids = [...flow.children], order = [2, 1, 3, 0, 4];   // build from the gateway outward
  order.forEach((k, n) => S.every(t => show(kids[k], t, { at: 56 + n * 0.1, dur: 0.6, y: 20, blur: 6, scale: 0.95 })));
  const pk = flow.querySelector('.pk');
  S.every(t => {
    const c = (t - 56.9) / 1.4, ph = c - Math.floor(c), live = t >= 56.9 && t < 63.9;
    pk.style.opacity = live ? (Math.sin(Math.PI * ph)).toFixed(3) : '0';
    pk.style.left = (ph * 134).toFixed(1) + 'px';
  });
}
anim(node('Plan: the gateway in front of each client site, <code>pay_to</code> set to the client\'s own address.', 'wf', gDist, { y: 690 }), { at: 56.6, y: 14, blur: 6 });
AT.Badge({ text: 'PLAN · no client site runs AgentToll yet', at: 55.8, out: 63.3, right: 64, y: 96 });

/* ================================================================== 11 WHAT'S NEXT, PLAN (63.8 - 73.5) */
const gNext = AT.Group({ name: 'next', t0: 63.8, t1: 73.5 }).e;
AT.SectionLabel({ parent: gNext, num: '11', text: "WHAT'S NEXT", at: 63.95, x: 128, y: 120 });
AT.Headline({ parent: gNext, lines: ['From devnet to mainnet:', { text: 'the plan.', grad: true }], at: 64, x: 122, y: 160, size: 60, stagger: 0.04 });
const NEXT = [
  ['Fund the devnet buyer:', 'the first real settlement, with a Solana Explorer link.'],
