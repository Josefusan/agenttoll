<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentToll pitch insert</title>
<!--
  The 70 s middle of the 2:30 pitch cut: 04 Why now, 05 Who buys, 06 Business model (PLAN),
  07 Distribution (PLAN). The pitch film is assembled by video/render/edl.mjs from EDL.json:
  hero 0-43.35 s, this insert, hero 43.4-68.95 s (Claude pays, refusal), hero 77.95-90.5 s
  (proof, close). Every line on screen is quoted from docs/launch/PITCH_VIDEO.md,
  docs/COLOSSEUM_SUBMISSION.md or docs/KNOWLEDGE_BASE.md (ids shown on screen). Anything about
  money AgentToll might make carries a gold PLAN badge: there are no customers and no revenue.
-->
<link rel="stylesheet" href="../../engine/engine.css">
<script src="../../engine/timeline.js"></script>
<style>
  .grp { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
  .kcard { position: absolute; width: 812px; height: 300px; padding: 30px 36px; border-radius: 22px; background: rgba(14,12,32,0.9);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 0 rgba(255,255,255,0.06) inset, 0 40px 80px -28px rgba(0,0,0,0.7); }
  .kcard .id { font: 600 15px/1 var(--mono); letter-spacing: 0.2em; color: var(--teal); }
  .kcard .big { margin-top: 18px; font: 800 64px/1 var(--sans); letter-spacing: -0.035em; white-space: nowrap;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; }
  .kcard .tx { margin-top: 18px; font: 500 25px/1.38 var(--sans); color: var(--text); letter-spacing: -0.01em; }
  .kcard .so { position: absolute; left: 36px; bottom: 24px; font: 400 15px/1 var(--mono); color: var(--dim); }
  .closer { position: absolute; left: 0; width: 1920px; text-align: center; font: 600 40px/1.3 var(--sans); color: var(--text); letter-spacing: -0.02em; }
  .closer .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .btable { position: absolute; left: 128px; width: 1664px; }
  .brow { position: relative; display: grid; grid-template-columns: 420px 1fr; align-items: center; min-height: 112px; padding: 0 36px;
    border-radius: 18px; background: rgba(14,12,32,0.86); box-shadow: 0 0 0 1px rgba(255,255,255,0.07); margin-bottom: 18px; }
  .brow .b { font: 700 32px/1.15 var(--sans); color: var(--text); letter-spacing: -0.02em; }
  .brow .w { font: 400 26px/1.4 var(--sans); color: var(--muted); }
  .brow .w code { font: 500 0.9em var(--mono); color: var(--text); }
  .honest { position: absolute; font: 500 22px/1.4 var(--mono); color: var(--muted); letter-spacing: 0.02em; }
  .honest b { color: var(--text); }

  .plan { position: absolute; left: 128px; width: 1664px; }
  .plan .hdr { font: 700 30px/1.3 var(--sans); color: var(--text); letter-spacing: -0.01em; margin-bottom: 26px; }
  .plan .hdr .gd { color: var(--gold); }
  .pl { position: relative; display: flex; gap: 26px; align-items: baseline; padding: 24px 32px; margin-bottom: 16px; border-radius: 16px;
    background: rgba(14,12,32,0.86); box-shadow: 0 0 0 1px rgba(255,255,255,0.07); }
  .pl .n { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 17px/1 var(--mono);
    color: var(--ink); background: var(--teal); transform: translateY(-4px); }
  .pl .t { font: 400 26px/1.42 var(--sans); color: var(--muted); }
  .pl .t b { color: var(--text); font-weight: 700; }

  .wf { position: absolute; left: 0; width: 1920px; text-align: center; }
  .wf .s { margin-top: 34px; font: 400 30px/1.5 var(--sans); color: var(--muted); }
  .wf .s code { font: 600 0.9em var(--mono); color: var(--text); }
  .flowrow { position: absolute; left: 0; width: 1920px; display: flex; justify-content: center; align-items: center; gap: 26px; }
  .fnode { padding: 22px 30px; border-radius: 18px; background: rgba(16,14,36,0.92); box-shadow: 0 0 0 1px rgba(255,255,255,0.09); text-align: left; }
  .fnode .tg { font: 600 13px/1 var(--mono); letter-spacing: 0.18em; color: var(--teal); }
  .fnode .tt { margin-top: 10px; font: 700 28px/1.1 var(--sans); color: var(--text); white-space: nowrap; }
  .farr { font: 400 34px/1 var(--mono); color: var(--dim); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const S = AT.scene({ duration: 70, progress: false, seed: 23 });
const { el, style, show, progress, ease, lerp, spring } = AT;
const W = 1920;
const node = (html, cls, parent, pos) => { const e = el('div', cls, parent, html); AT.place(e, pos || {}); return e; };
const anim = (e, o) => { S.every(t => show(e, t, o)); return e; };
const center = h => { h.el.style.width = W + 'px'; h.el.style.left = '0px'; h.el.style.textAlign = 'center'; for (const ln of h.el.querySelectorAll('.line')) ln.style.margin = '0 auto'; return h; };
// scenes enter clean and leave with a short blur-out to the background
const groups = [];
function group(t0, t1) { const e = el('div', 'grp', S.world); groups.push({ e, t0, t1 }); return e; }
S.every(t => {
  for (const g of groups) {
    const live = t >= g.t0 && t <= g.t1;
    g.e.style.display = live ? 'block' : 'none'; if (!live) continue;
    const p = ease.easeOutCubic(progress(t, g.t0, g.t0 + 0.7)), q = ease.easeInCubic(progress(t, g.t1 - 0.45, g.t1));
    g.e.style.opacity = (ease.easeOutCubic(progress(t, g.t0, g.t0 + 0.4)) * (1 - q)).toFixed(4);
    g.e.style.transform = `scale(${(lerp(0.96, 1, p) * (1 + 0.02 * q)).toFixed(5)})`;
    const b = (1 - p) * 10 + q * 18; g.e.style.filter = b > 0.1 ? `blur(${b.toFixed(2)}px)` : 'none';
  }
});
const camKeys = [];

/* ================================================================== 04 WHY NOW (0 - 25) */
const g4 = group(0, 25.2);
AT.SectionLabel({ parent: g4, num: '04', text: 'WHY NOW', at: 0.2, x: 128, y: 120 });
AT.Headline({ parent: g4, lines: ['The rails just landed.'], at: 0.35, x: 122, y: 166, size: 72 });
const CARDS = [
  { id: 'KB-MKT-01', big: '≈ $3.3M', tx: 'USDC settled over x402 on Solana in one week. Solana took the top spot for x402 agent payments.', so: 'docs/KNOWLEDGE_BASE.md · solanacompass.com', at: 2.4 },
  { id: 'KB-SOL-03', big: '2026-09-30', tx: 'PayAI opened x402 batch settlement on Solana in public preview: a mainnet path for sub-cent traffic.', so: 'docs/KNOWLEDGE_BASE.md · solanacompass.com', at: 6.6 },
  { id: 'KB-MKT-01', big: 'Waitlist only', tx: 'Cloudflare opened a waitlist for an x402 Monetization Gateway on 2026-07-01, for Cloudflare customers only.', so: 'docs/KNOWLEDGE_BASE.md · explainx.ai', at: 10.8 },
  { id: 'KB-PAY-06', big: 'Agent wallets', tx: "Coinbase's own Payments MCP already pays x402 on Solana, so agent wallets exist today.", so: 'docs/KNOWLEDGE_BASE.md · docs.cdp.coinbase.com', at: 15.0 },
];
CARDS.forEach((c, i) => {
  const x = i % 2 ? 1000 : 108, y = i < 2 ? 300 : 630;
  const e = node(`<div class="id">${c.id}</div><div class="big">${c.big}</div><div class="tx">${c.tx}</div><div class="so">${c.so}</div>`, 'kcard', g4, { x, y });
  e.id = 'card' + i;
  S.every(t => show(e, t, { at: c.at, dur: 0.8, y: 30, blur: 10, scale: 0.97 }));
  AT.sfx(c.at, 'tick', { gain: 0.7 });
  camKeys.push({ t: c.at + 0.25, to: '#card' + i, scale: 1.7, dur: 0.6 }, { t: c.at + 3.4, to: 'full', dur: 0.55 });
});
center(AT.Headline({ parent: g4, lines: ['The open, self-hosted, non-custodial version', { text: 'was not built. So we built it.', grad: true }], at: 20.2, y: 380, size: 64, stagger: 0.04 }));
for (const i of [0, 1, 2, 3]) AT.dim(document.getElementById('card' + i), [[19.9, 99]], { o: 0.1, blur: 8, ramp: 0.6 });

/* ================================================================== 05 WHO BUYS (25 - 40) */
const g5 = group(24.9, 40.2);
AT.SectionLabel({ parent: g5, num: '05', text: 'WHO BUYS', at: 25.1, x: 128, y: 120 });
AT.Headline({ parent: g5, lines: ['Sellers whose product', { text: 'agents already use.', grad: true }], at: 25.25, x: 122, y: 166, size: 64 });
const BUYERS = [
  ['API or data founder', 'A price per call any agent can pay in seconds, no signup, no key issuing'],
  ['Publisher or docs site', 'Agents pay to read, people read free, plus a report of the agent traffic they are not billing yet'],
  ['MCP server author', 'A price per tool; <code>initialize</code> and <code>tools/list</code> stay free'],
  ['Agency', "Agent revenue as a line item on every client site, funds to the client's own address"],
];
const bt = node('', 'btable', g5, { y: 372 });
BUYERS.forEach(([b, w], i) => {
  const r = el('div', 'brow', bt, `<div class="b">${b}</div><div class="w">${w}</div>`);
  S.every(t => show(r, t, { at: 27.0 + i * 1.7, dur: 0.7, x: -30, y: 0, blur: 8 }));
  AT.sfx(27.0 + i * 1.7, 'tick', { gain: 0.5 });
});
anim(node('<b>Buyer types, not customers.</b> No customers and no revenue yet.', 'honest', g5, { x: 128, y: 920 }), { at: 34.6, y: 10, blur: 4 });

/* ================================================================== 06 BUSINESS MODEL, PLAN (40 - 60) */
const g6 = group(39.9, 60.2);
AT.SectionLabel({ parent: g6, num: '06', text: 'BUSINESS MODEL', at: 40.1, x: 128, y: 120 });
AT.Headline({ parent: g6, lines: ['How we make money:', { text: 'a plan, no revenue yet.', grad: true }], at: 40.25, x: 122, y: 166, size: 64 });
const PLAN = [
  ['Hosted AgentToll:', "we run gateway and dashboard; flat monthly tier plus a fee on settled volume, billed off-chain. pay_to stays the founder's."],
  ['Payout destinations:', "the founder's own off-ramp account as pay_to, with a threshold sweeper."],
  ['Agency bundle:', 'AgentToll on every Website Factory site, dashboard per client, line item on the retainer.'],
  ['Pro dashboard:', 'multi-site, exports, alerts, the unbilled-traffic report.'],
];
const pl = node(`<div class="hdr"><span class="gd">PLAN.</span> Open-source core stays free. No take rate in the gateway.</div>`, 'plan', g6, { y: 360 });
anim(pl.querySelector('.hdr'), { at: 41.6, y: 12, blur: 6 });
PLAN.forEach(([k, v], i) => {
  const r = el('div', 'pl', pl, `<span class="n">${i + 1}</span><span class="t"><b>${k}</b> ${v}</span>`);
  S.every(t => show(r, t, { at: 43.0 + i * 3.4, dur: 0.7, y: 20, blur: 8 }));
  AT.sfx(43.0 + i * 3.4, 'tick', { gain: 0.5 });
});
AT.Badge({ text: 'PLAN · no revenue yet', at: 40.6, out: 59.9, right: 64, y: 96 });

/* ================================================================== 07 DISTRIBUTION, PLAN (60 - 70) */
const g7 = group(59.9, 70);
AT.SectionLabel({ parent: g7, num: '07', text: 'DISTRIBUTION', at: 60.1, x: 128, y: 120 });
center(AT.Headline({ parent: g7, lines: ['Website Factory ships the sites.', { text: 'AgentToll rides along.', grad: true }], at: 60.3, y: 230, size: 84, stagger: 0.05 }));
const fr = node(`<div class="fnode"><div class="tg">CLIENT SITE</div><div class="tt">Vercel origin</div></div><div class="farr">←</div>
  <div class="fnode"><div class="tg">GATEWAY</div><div class="tt">AgentToll</div></div><div class="farr">→</div>
  <div class="fnode"><div class="tg">pay_to</div><div class="tt">the client's address</div></div>`, 'flowrow', g7, { y: 520 });
anim(fr, { at: 62.0, y: 24, blur: 8 });
const wf = node(`<div class="s">Gateway on the agency VPS or the Worker edition, in front of the client's Vercel origin. <code>pay_to</code> = the client's address.</div>`, 'wf', g7, { y: 680 });
anim(wf, { at: 63.0, y: 14, blur: 6 });
AT.Badge({ text: 'PLAN · no client site runs AgentToll yet', at: 60.6, out: 69.6, right: 64, y: 96 });

AT.Camera({ keys: camKeys });
AT.sfx(24.9, 'whoosh', { gain: 0.45 });
AT.sfx(39.9, 'whoosh', { gain: 0.45 });
AT.sfx(59.9, 'whoosh', { gain: 0.45 });

for (const [html, at, out] of [
  ['<b>Why now:</b> docs/KNOWLEDGE_BASE.md (KB-MKT-01, KB-SOL-03, KB-PAY-06) · docs/COLOSSEUM_SUBMISSION.md · re-check each figure on submit day', 2.6, 24.8],
  ['<b>Who buys:</b> docs/launch/PITCH_VIDEO.md (buyer types, not customers)', 26.0, 39.8],
  ['<b>Plan:</b> docs/launch/PITCH_VIDEO.md · docs/COLOSSEUM_SUBMISSION.md (business model, plan)', 41.0, 59.8],
  ['<b>Distribution (plan):</b> docs/launch/PITCH_VIDEO.md · docs/COLOSSEUM_SUBMISSION.md (go-to-market)', 61.0, 69.8],
]) AT.Source({ html, at, out });

AT.Caption({ cues: [
  { at: 0.6, end: 2.3, text: 'Why now? The rails just landed.' },
  { at: 2.6, end: 6.4, text: 'Solana took the top spot for x402 agent payments: about $3.3M USDC in one week.' },
  { at: 6.8, end: 10.6, text: 'PayAI opened batch settlement on Solana in public preview on September 30.' },
  { at: 11.0, end: 14.8, text: 'Cloudflare announced a gateway in July: waitlist-only, tied to its network.' },
  { at: 15.2, end: 19.6, text: "Agents already hold wallets: Coinbase's Payments MCP pays x402 on Solana." },
  { at: 20.4, end: 24.6, text: 'The open, self-hosted version was not built. So we built it.' },
  { at: 25.6, end: 29.0, text: 'Who buys: four kinds of seller whose product agents already use.' },
  { at: 29.2, end: 34.2, text: 'None of them need a billing system. They need one YAML file and an address.' },
  { at: 34.6, end: 39.6, text: 'These are buyer types, not customers.' },
  { at: 40.6, end: 43.6, text: 'How we make money. This is a plan: there is no revenue yet.', gold: ['plan:'] },
  { at: 43.8, end: 49.6, text: 'The core stays free and non-custodial. We charge for convenience and scale.' },
  { at: 49.8, end: 55.4, text: 'Hosted, payout destinations, an agency bundle, a pro dashboard.' },
  { at: 55.6, end: 59.6, text: 'Never by standing between the seller and their funds.' },
  { at: 60.6, end: 64.6, text: 'Distribution: Website Factory already ships sites to businesses.' },
  { at: 64.8, end: 69.6, text: "The plan: AgentToll in front of them, pay_to set to each client's own address.", gold: ['plan:'] },
] });
</script>
</body>
</html>
