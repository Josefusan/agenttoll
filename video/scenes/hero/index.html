<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentToll hero film</title>
<!--
  AgentToll hero film, 90.5 s, one continuous timeline on the scene engine (video/engine).
  Every on-screen string is sourced in SHOTLIST.md (next to this file). Caption pills are mirrored
  in captions.json for the guardrail checks. Payments shown are SIMULATED (mock facilitator); the
  gold "SIMULATED · no funds moved" badge is on without a break from 32.4 s to 77.3 s, and the
  render fails (S.requireBadge) if any frame in 32.7-77.0 s lacks it.
  ?cut=pitch renumbers the section labels for the 2:30 pitch cut (video/scenes/pitch/EDL.json).
-->
<link rel="stylesheet" href="../../engine/engine.css">
<script src="../../engine/timeline.js"></script>
<style>
  .grp { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
  .sub { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
  .wipe { position: absolute; top: -200px; height: 1480px; width: 240px; left: 0; pointer-events: none; z-index: 40;
    background: linear-gradient(90deg, rgba(139,92,246,0) 0%, rgba(139,92,246,0.55) 30%, rgba(59,130,246,0.75) 50%, rgba(45,212,191,0.55) 70%, rgba(45,212,191,0) 100%);
    filter: blur(14px); }
  .wipe-core { position: absolute; top: -200px; height: 1480px; width: 3px; left: 0; z-index: 41; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.95) 30%, rgba(255,255,255,0.95) 70%, rgba(255,255,255,0));
    box-shadow: 0 0 18px rgba(167,139,250,0.9), 0 0 42px rgba(45,212,191,0.6); }

  /* wordmark lockup (open + close) */
  .lock-icon { position: absolute; width: 176px; height: 176px; left: 872px; filter: drop-shadow(0 24px 48px rgba(109,40,217,0.55)); }
  .tagline { position: absolute; left: 0; width: 1920px; text-align: center; font: 600 46px/1.25 var(--sans); letter-spacing: -0.02em; color: var(--text); }
  .tagline .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .repo { position: absolute; left: 0; width: 1920px; text-align: center; font: 600 30px/1 var(--mono); color: var(--teal); letter-spacing: 0.01em; }
  .event { position: absolute; left: 0; width: 1920px; text-align: center; font: 600 18px/1 var(--mono); color: var(--muted); letter-spacing: 0.32em; }

  /* cold open: the 402 line slams in gold */
  .slam .c-yellow { color: #FCD34D; text-shadow: 0 0 calc(var(--glow, 0) * 28px) rgba(251,191,36,0.85), 0 0 calc(var(--glow, 0) * 60px) rgba(251,191,36,0.45); }
  .slam .ln { transform-origin: 0 50%; }

  /* labels + pills */
  .who { position: absolute; font: 600 18px/1 var(--mono); letter-spacing: 0.2em; color: var(--muted); white-space: nowrap; }
  .who b { color: var(--text); font-weight: 700; }
  .pill { position: absolute; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 14px; border-radius: 999px; white-space: nowrap;
    font: 700 19px/1 var(--mono); letter-spacing: 0.01em; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .pill.ok { color: #4ADE80; background: rgba(74,222,128,0.12); box-shadow: 0 0 0 1px rgba(74,222,128,0.45) inset, 0 8px 30px -8px rgba(74,222,128,0.5); }
  .pill.ok i { background: #4ADE80; box-shadow: 0 0 10px #4ADE80; }
  .pill.pay { color: var(--gold); background: rgba(251,191,36,0.12); box-shadow: 0 0 0 1px rgba(251,191,36,0.5) inset, 0 8px 30px -8px rgba(251,191,36,0.55); }
  .pill.pay i { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .pill.bad { color: #F87171; background: rgba(248,113,113,0.12); box-shadow: 0 0 0 1px rgba(248,113,113,0.5) inset, 0 8px 30px -8px rgba(248,113,113,0.5); }
  .pill.bad i { background: #F87171; box-shadow: 0 0 10px #F87171; }

  .fn { position: absolute; font: 400 15px/1.45 var(--mono); color: var(--dim); letter-spacing: 0.01em; white-space: nowrap; }
  .fn b { color: var(--muted); font-weight: 500; }
  .note { position: absolute; font: 400 28px/1.45 var(--sans); color: var(--muted); letter-spacing: -0.01em; }
  .note b { color: var(--text); font-weight: 600; }

  /* terminal extras */
  .at-term .ln .c-clip { display: inline-block; max-width: 100%; white-space: nowrap; overflow: hidden; vertical-align: top;
    -webkit-mask-image: linear-gradient(90deg, #000 78%, rgba(0,0,0,0)); mask-image: linear-gradient(90deg, #000 78%, rgba(0,0,0,0)); }
  .at-term .ln { position: relative; }
  .lnhl { position: absolute; left: -12px; right: -12px; top: -2px; bottom: -2px; border-radius: 8px; pointer-events: none; }
  .lnhl.red { background: rgba(248,113,113,0.12); box-shadow: 0 0 0 1px rgba(248,113,113,0.45) inset; }
  .lnhl.gold { background: rgba(251,191,36,0.10); box-shadow: 0 0 0 1px rgba(251,191,36,0.45) inset; }

  /* decoded quote card (02) */
  .card { position: absolute; border-radius: 18px; background: rgba(14,12,32,0.92); overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 0 rgba(255,255,255,0.07) inset, 0 40px 80px -24px rgba(0,0,0,0.7); }
  .card .hd { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--line);
    font: 600 15px/1 var(--mono); letter-spacing: 0.16em; color: var(--muted); background: rgba(255,255,255,0.025); white-space: nowrap; }
  .card .hd b { color: var(--teal); font-weight: 700; }
  .card .hd .src { margin-left: auto; letter-spacing: 0.02em; color: var(--dim); font-weight: 400; }
  .qrow { position: relative; display: flex; align-items: center; height: 50px; padding: 0 24px; font: 400 21px/1 var(--mono); white-space: nowrap; }
  .qrow .k { width: 236px; color: var(--t-dim); }
  .qrow .v { color: var(--t-text); }
  .qrow .n { margin-left: 22px; font: 600 20px/1 var(--sans); letter-spacing: -0.01em; display: inline-flex; align-items: center; gap: 10px; }
  .qrow .n .arr { font-family: var(--mono); color: var(--dim); font-weight: 400; }
  .qrow .hlb { position: absolute; left: 10px; right: 10px; top: 4px; bottom: 4px; border-radius: 10px; }
  .qrow.gold .v, .qrow.gold .n { color: var(--gold); }
  .qrow.gold .hlb { background: rgba(251,191,36,0.10); box-shadow: 0 0 0 1px rgba(251,191,36,0.42) inset; }
  .qrow.teal .n { color: var(--teal); }
  .qrow.teal .hlb { background: rgba(45,212,191,0.08); box-shadow: 0 0 0 1px rgba(45,212,191,0.35) inset; }
  .qrow.vio .n { color: #C4B5FD; }
  .qrow.vio .hlb { background: rgba(139,92,246,0.10); box-shadow: 0 0 0 1px rgba(139,92,246,0.42) inset; }

  /* why x402 / why Solana (02b) */
  .why-tag { position: absolute; font: 600 18px/1 var(--mono); letter-spacing: 0.24em; color: var(--teal); white-space: nowrap; }
  .sol { display: inline-block; width: 0.95em; height: 0.8em; vertical-align: -0.04em; margin-right: 0.28em; }

  /* step rail (03) */
  .rail { position: absolute; display: flex; gap: 14px; }
  .step { position: relative; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px 0 10px; border-radius: 999px;
    font: 600 19px/1 var(--sans); color: var(--dim); background: rgba(255,255,255,0.03); box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset; white-space: nowrap; }
  .step .no { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--mono);
    color: var(--dim); background: rgba(255,255,255,0.05); }
  .step .ring { position: absolute; inset: 0; border-radius: 999px; padding: 2px; background: var(--grad);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; }
  .step.goldstep .ring { background: linear-gradient(90deg, #FDE68A, #FBBF24, #F59E0B); }
  .at-node .ns .sol { width: 18px; height: 15px; vertical-align: -2px; margin-right: 6px; }

  /* dashboard content (01) */
  .dash { position: relative; overflow: hidden; }
  .dash > img.page { position: absolute; left: 0; top: 0; display: block; }
  .money { position: absolute; font: 800 30px/1 var(--sans); color: var(--gold); letter-spacing: -0.02em; white-space: nowrap; padding: 0.22em 0.42em; border-radius: 0.4em; background: rgba(9,8,22,0.92); box-shadow: 0 0 0 1px rgba(251,191,36,0.6) inset, 0 0 24px rgba(251,191,36,0.45); }
  .tip { position: absolute; padding: 12px 18px 14px; border-radius: 10px; background: #F4F4F6; color: #1C1B22; white-space: nowrap;
    font: 400 21px/1.35 -apple-system, "Inter", sans-serif; box-shadow: 0 0 0 1px rgba(0,0,0,0.25), 0 12px 32px rgba(0,0,0,0.5); }

  /* the dashboard row this payment wrote (04) and the live-feed crop (05) */
  .rowcard { position: absolute; }
  .rowcard .lab { font: 600 16px/1 var(--mono); letter-spacing: 0.2em; color: var(--muted); margin-bottom: 16px; white-space: nowrap; text-align: right; }
  .rowcard .lab b { color: var(--teal); font-weight: 700; }
  .crop { position: relative; border-radius: 16px; overflow: hidden; background-repeat: no-repeat;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 40px 90px -24px rgba(0,0,0,0.8); }
  .crop .ringg { position: absolute; inset: 0; border-radius: 16px; box-shadow: 0 0 0 2.5px rgba(251,191,36,0.9) inset, 0 0 36px rgba(251,191,36,0.45); opacity: 0; }
  .lift { position: absolute; border-radius: 10px; background-repeat: no-repeat; transform-origin: 50% 50%; }
  .lift .glow { position: absolute; inset: -3px; border-radius: 12px; box-shadow: 0 0 0 2px rgba(251,191,36,0.85), 0 0 26px rgba(251,191,36,0.55); opacity: 0; }

  /* caps card (04) */
  .crow { position: relative; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 30px;
    font: 400 25px/1 var(--mono); color: var(--t-text); border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
  .crow .k { color: var(--t-dim); }
  .crow .v { color: var(--text); font-weight: 600; }
  .crow .hlb { position: absolute; left: 8px; right: 8px; top: 6px; bottom: 6px; border-radius: 10px; opacity: 0;
    background: rgba(248,113,113,0.12); box-shadow: 0 0 0 1.5px rgba(248,113,113,0.7) inset, 0 0 28px rgba(248,113,113,0.25); }
  .cfoot { padding: 20px 30px; display: flex; gap: 14px; align-items: center; font: 400 20px/1.4 var(--sans); color: var(--muted); }

  /* tools card (05) */
  .trow { position: relative; padding: 18px 28px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .trow .nm { font: 600 25px/1.1 var(--mono); color: var(--text); display: flex; align-items: center; gap: 14px; }
  .trow .ds { margin-top: 10px; font: 400 20px/1.35 var(--sans); color: var(--muted); white-space: nowrap; }
  .trow .ds .pr { color: var(--gold); font-weight: 600; }
  .trow .ds .fr { color: #4ADE80; font-weight: 600; }
  .trow .hlb { position: absolute; left: 8px; right: 8px; top: 6px; bottom: 6px; border-radius: 12px; opacity: 0;
    background: rgba(251,191,36,0.07); box-shadow: 0 0 0 1.5px rgba(251,191,36,0.6) inset; }

  /* proof */
  .at-stat .num { font-size: 92px; }
  .proofline { position: absolute; font: 500 31px/1.4 var(--sans); color: var(--text); letter-spacing: -0.015em; }
  .proofline .m { color: var(--muted); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const PITCH = new URLSearchParams(location.search).get('cut') === 'pitch';
const NUM = n => (PITCH ? { '04': '08', '05': '09', '06': '09' }[n] || n : n);   // pitch cut: the pitch insert owns 04-07
const TICKS = [5, 14, 26, 32, 43.4, 68.9, 77.1, 86];
const S = AT.scene({ duration: 90.5, progress: { ticks: TICKS }, seed: 11 });
const { el, style, show, progress, ease, lerp, clamp, spring, tween } = AT;
const W = 1920, H = 1080;
const CAP = '../../captures/';
const DOCS = '../../../docs/assets/';
const BRAND = '../../../brand/';
const SOL = '<svg class="sol" viewBox="0 0 397 311"><defs><linearGradient id="solg" x1="360" y1="-37" x2="141" y2="383" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00FFA3"/><stop offset="1" stop-color="#DC1FFF"/></linearGradient></defs><path fill="url(#solg)" d="M64.6 237.9a13 13 0 0 1 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7a13 13 0 0 1-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1zM64.6 3.8A13.4 13.4 0 0 1 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7a13 13 0 0 1-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1zM333.1 120.1a13 13 0 0 0-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7a13 13 0 0 0 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1z"/></svg>';

/* ------------------------------------------------------------------ groups + transitions
   Each scene lives in a .grp inside S.world. One transition grammar: a scene leaves with a short
   blur-out to the background and the next one builds clean ("push"), or a gradient wipe cuts
   between two scenes at rest. The camera is always back at full frame before a scene leaves, so
   two zoom states never dissolve into each other. */
const groups = {};
function group(name, t0, t1, o = {}) {
  const e = el('div', 'grp', S.world); e.id = 'g-' + name;
  return (groups[name] = { e, t0, t1, enter: o.enter || 'push', exit: o.exit || 'push', drift: o.drift == null ? 0.018 : o.drift, clip: null });
}
const wipes = [];
function Wipe(at, dur, from, to, dir = 1) {
  const band = el('div', 'wipe', S.overlay), core = el('div', 'wipe-core', S.overlay);
  wipes.push({ at, dur, from, to, dir, band, core });
  groups[from].exit = 'wipe'; groups[to].enter = 'wipe';
  AT.sfx(at + 0.05, 'whoosh', { gain: 0.8, pan: dir > 0 ? 0.3 : -0.3 });
}
const SKEW = 220;
S.every(t => {
  for (const g of Object.values(groups)) g.clip = null;
  for (const w of wipes) {
    w.band.style.visibility = w.core.style.visibility = 'hidden';
    const p = progress(t, w.at, w.at + w.dur);
    const vis = t >= w.at - 0.001 && t <= w.at + w.dur + 0.001 && p > 0 && p < 1;
    const X = lerp(-SKEW - 260, W + 260, ease.easeInOutCubic(p));
    const xt = w.dir > 0 ? X + SKEW / 2 : W - X - SKEW / 2, xb = w.dir > 0 ? X - SKEW / 2 : W - X + SKEW / 2;
    const A = groups[w.from], B = groups[w.to];
    if (t < w.at) { B.clip = 'hide'; continue; }
    if (t >= w.at + w.dur) { A.clip = 'hide'; continue; }
    if (w.dir > 0) {
      A.clip = `polygon(${xt}px -40px, 2000px -40px, 2000px 1120px, ${xb}px 1120px)`;
      B.clip = `polygon(-80px -40px, ${xt}px -40px, ${xb}px 1120px, -80px 1120px)`;
    } else {
      A.clip = `polygon(-80px -40px, ${xt}px -40px, ${xb}px 1120px, -80px 1120px)`;
      B.clip = `polygon(${xt}px -40px, 2000px -40px, 2000px 1120px, ${xb}px 1120px)`;
    }
    const ang = Math.atan2(SKEW, 1480) * (w.dir > 0 ? 1 : -1) * 180 / Math.PI;
    const xm = (xt + xb) / 2;
    for (const [e, wd] of [[w.band, 240], [w.core, 3]]) {
      e.style.visibility = vis ? 'visible' : 'hidden';
      e.style.transform = `translateX(${(xm - wd / 2).toFixed(1)}px) rotate(${ang.toFixed(2)}deg)`;
      e.style.opacity = (Math.sin(Math.PI * p) * 1.4).toFixed(3);
    }
  }
  for (const g of Object.values(groups)) {
    const live = t >= g.t0 - 0.001 && t <= g.t1 + 0.001 && g.clip !== 'hide';
    if (!live) { g.e.style.display = 'none'; continue; }
    g.e.style.display = 'block';
    let o = 1, s = 1 + g.drift * ease.easeInOutSine(progress(t, g.t0, g.t1)), blur = 0;
    if (g.enter === 'push') {
      const p = ease.easeOutCubic(progress(t, g.t0, g.t0 + 0.7));
      o *= ease.easeOutCubic(progress(t, g.t0, g.t0 + 0.4)); s *= lerp(0.94, 1, p); blur += (1 - p) * 10;
    }
    if (g.exit === 'push') {
      // blur-out to the background: no scale-up, so no giant fragments over the next scene
      const q = ease.easeInCubic(progress(t, g.t1 - 0.45, g.t1));
      o *= 1 - q; s *= 1 + 0.02 * q; blur += q * 18;
    }
    g.e.style.opacity = o >= 0.999 ? '1' : o.toFixed(4);
    g.e.style.transform = `scale(${s.toFixed(5)})`;
    g.e.style.filter = blur > 0.1 ? `blur(${blur.toFixed(2)}px)` : 'none';
    g.e.style.clipPath = g.clip && g.clip !== 'hide' ? g.clip : 'none';
  }
});

function node(html, cls, parent, pos) { const e = el('div', cls, parent, html); AT.place(e, pos || {}); return e; }
function anim(e, o) { S.every(t => show(e, t, o)); return e; }
function center(h) { h.el.style.width = W + 'px'; h.el.style.left = '0px'; h.el.style.textAlign = 'center';
  for (const ln of h.el.querySelectorAll('.line')) ln.style.margin = '0 auto'; return h; }
const camKeys = [];
const cam = (t, to, o = {}) => camKeys.push(Object.assign({ t, to }, o));

/* ================================================================== 00 COLD OPEN (0 - 5)
   Frame one is the answer: a giant gold "402 Payment Required" from the real ClaudeBot request.
   The camera pushes out to reveal the terminal it came from, the terminal blurs out completely,
   then the wordmark and the tagline land. */
const g0 = group('open', 0, 5.3, { enter: 'none', drift: 0 }).e;
const t0 = AT.Terminal({
  parent: g0, x: 210, y: 360, w: 1500, h: 352, title: 'zsh', at: -1, out: 1.6, fontSize: 40, lineHeight: 1.45, wrap: true, keys: false,
  lines: [
    { cmd: "curl -s -i -A 'Mozilla/5.0 (compatible; ClaudeBot/1.0)' http://127.0.0.1:8502/api/quote", at: -1, dur: 0.01 },
    { out: [['HTTP/1.1 402 Payment Required', 'yellow bold']], at: 0.06 },
    { out: [['x-agenttoll-verdict: ', 'dim'], ['ua:ClaudeBot', 'cyan']], at: 0.32 },
  ],
  // while the camera is in, only the answer is on screen; the command fades up on the pull-out
  focus: [{ at: -1, out: 0.9, match: /^HTTP\/1\.1 402|x-agenttoll-verdict/, dimTo: 0 }],
});
t0.el.classList.add('slam');
{
  let l402 = null;
  S.every(t => {
    if (!l402) l402 = [...t0.el.querySelectorAll('.ln')].find(l => l.textContent.startsWith('HTTP/1.1 402'));
    // scale punch 1.04 -> 1 with a gold glow that holds while the camera is in, then settles
    const sp = spring(t - 0.06, 420, 22);
    l402.style.transform = `scale(${lerp(1.06, 1, clamp(sp, 0, 1.2)).toFixed(4)})`;
    t0.el.style.setProperty('--glow', (ease.easeOutCubic(progress(t, 0.06, 0.2)) * (1 - 0.6 * ease.easeInOutCubic(progress(t, 0.95, 1.45)))).toFixed(3));
  });
}
cam(-0.2, () => t0.rect(/^HTTP\/1\.1 402|x-agenttoll-verdict/, 0.4, 4), { dur: 0.01, scale: 2.3, pad: 16 });
cam(0.95, 'full', { dur: 0.5 });
AT.sfx(0.06, 'thud', { gain: 1 });
AT.sfx(1.2, 'riser', { gain: 0.7 });
AT.sfx(2.02, 'lift', { gain: 0.9 });
{
  const icon = AT.img(BRAND + 'icon.svg', 'lock-icon', g0); icon.style.top = '214px';
  S.every(t => {
    const sp = spring(t - 2.0, 180, 18);
    style(icon, { o: ease.easeOutCubic(progress(t, 2.0, 2.3)), s: lerp(0.5, 1, sp), y: (1 - Math.min(1, sp)) * 30, r: (1 - sp) * -8 });
  });
  center(AT.Headline({ parent: g0, lines: [{ text: 'AgentToll', grad: true }], at: 2.1, y: 410, size: 150 }));
  const tg = node('Agents already use your product. <span class="g">Now you can bill them.</span>', 'tagline', g0, { y: 626 });
  anim(tg, { at: 2.6, dur: 0.75, y: 22, blur: 8 });
}

/* ================================================================== 01 THE PROBLEM (5 - 14) */
const g1 = group('problem', 4.9, 14.7).e;
AT.SectionLabel({ parent: g1, num: '01', text: 'THE PROBLEM', at: 5.0, x: 128, y: 160, out: 8.75 });
AT.Headline({ parent: g1, lines: ['Agents read.', { text: 'Founders pay.', grad: true }], at: 5.1, x: 122, y: 214, size: 112, out: 8.7 });
anim(node('Until now the choices were <b>block them</b> or <b>absorb it.</b>', 'note', g1, { x: 128, y: 500, w: 720 }), { at: 6.3, out: 8.7 });
AT.Terminal({
