# AgentToll config. Copy to agenttoll.yaml. Prices are quoted decimal strings ("0.002"), never bare numbers. See ARCHITECTURE.md §1.4 and docs/KNOWLEDGE_BASE.md.
origin: http://localhost:4000          # demo origin; your site or API in production
listen: 0.0.0.0:8402
admin_listen: 127.0.0.1:8403           # dashboard reads /admin/stats and /admin/events (SSE)
detection: agents-only                 # agents-only | all-requests | off
# public_url: https://acme.dev         # quoted as resource.url in 402s; default http://<Host>
# preserve_host: false                 # send the client's Host to the origin (off for Vercel etc.)

networks:
  solana:
    network: "solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"   # devnet (KB-SOL-01)
    asset: "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU" # devnet USDC (KB-SOL-01)
    pay_to: "${AGENTTOLL_SOLANA_PAYTO}"
    facilitator: "https://facilitator.payai.network"     # KB-X402-04
    # fee_payer: "<pubkey>"  # optional; read from the facilitator's /supported (KB-X402-07)
  base:
    network: "eip155:84532"                               # Base Sepolia (KB-BASE-01)
    asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"   # Base Sepolia USDC (KB-BASE-01)
    pay_to: "${AGENTTOLL_BASE_PAYTO}"
    facilitator: "https://x402.org/facilitator"          # testnet (KB-X402-04)

# Routes: "[METHOD ]/glob", first match wins, unmatched requests are free.
# Paths are canonicalized first (decoded, ?query and ;params dropped, // and .. resolved,
# trailing / dropped) and matched case-insensitively. `*` crosses `/`: "/api/*" matches
# /api/v1/deep but not /api itself. GET-only routes leave HEAD free.
routes:
  - match: "GET /api/quote"
    price_usd: "0.002"                 # 2000 atomic USDC (KB-AMT-01)
    description: "Live price quote"
  - match: "GET /api/*"
    price_usd: "0.001"
  - match: "GET /blog/*"
    price_usd: "0.001"
  - match: "/*"
    price_usd: "0"

mcp:
  endpoint: /mcp
  default_tool_price_usd: "0"
  tools:
    search_docs: "0.005"
    generate_report: "0.05"

ledger:
  url: "sqlite://agenttoll.db"         # postgres://... in production
